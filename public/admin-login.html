<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrator — Pilketos 2026</title>
    <meta name="description" content="Login administrator Pilketos 2026.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 20% 15%, rgba(46, 86, 166, 0.12), transparent 32%),
                radial-gradient(circle at 80% 85%, rgba(232, 185, 35, 0.12), transparent 30%),
                var(--paper);
        }

        .login-shell {
            width: min(440px, 100%);
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 18px;
        }

        .login-brand .brand-logo {
            box-shadow: 0 8px 24px rgba(11, 37, 84, 0.12);
        }

        .login-brand h1 {
            font-family: var(--font-head);
            color: var(--navy-900);
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .login-brand p {
            color: var(--muted);
            margin-top: 2px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.2px;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 24px 60px rgba(11, 37, 84, 0.10);
        }

        .login-card h2 {
            font-family: var(--font-head);
            color: var(--navy-900);
            font-size: 26px;
            line-height: 1.15;
            margin-bottom: 8px;
        }

        .login-card > p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .login-card label {
            display: block;
            margin-bottom: 7px;
            color: var(--navy-900);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.7px;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            width: 100%;
            height: 48px;
            padding: 0 48px 0 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #fff;
            color: var(--navy-900);
            font: 500 14px var(--font-body);
            transition: border-color .18s, box-shadow .18s;
        }

        .password-wrap input:focus {
            border-color: var(--navy-500);
            box-shadow: 0 0 0 3px rgba(46, 86, 166, 0.10);
            outline: none;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 9px;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font: 700 11px var(--font-body);
            padding: 7px;
        }

        .login-button {
            width: 100%;
            height: 46px;
            margin-top: 18px;
            border: 0;
            border-radius: 9px;
            background: var(--navy-700);
            color: #fff;
            font: 700 12px var(--font-body);
            letter-spacing: 0.7px;
            cursor: pointer;
            transition: transform .15s, background .18s;
        }

        .login-button:hover {
            background: var(--navy-900);
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .login-button:disabled {
            opacity: .65;
            cursor: wait;
        }

        .login-error {
            display: none;
            margin-top: 14px;
            padding: 11px 12px;
            border: 1px solid rgba(214, 40, 57, .20);
            border-radius: 8px;
            background: var(--red-100);
            color: var(--red-600);
            font-size: 12px;
            line-height: 1.5;
        }

        .login-footer {
            margin-top: 14px;
            text-align: center;
        }

        .login-footer a {
            color: var(--muted);
            font-size: 12px;
            text-decoration: none;
        }

        .login-footer a:hover {
            color: var(--navy-700);
        }

        @media (max-width: 520px) {
            .login-card {
                padding: 24px 20px;
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="login-brand">
            <div class="brand-logo">P</div>
            <div>
                <h1>PILKETOS</h1>
                <p>ADMINISTRATOR • PEMILIHAN 2026</p>
            </div>
        </div>

        <section class="login-card" aria-labelledby="loginTitle">
            <h2 id="loginTitle">Login Administrator</h2>
            <p>Masukkan password administrator untuk membuka panel pengaturan pemilihan.</p>

            <form id="loginForm">
                <label for="adminPassword">PASSWORD ADMINISTRATOR</label>
                <div class="password-wrap">
                    <input
                        id="adminPassword"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        autofocus
                        placeholder="Masukkan password"
                    >
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan password">
                        LIHAT
                    </button>
                </div>

                <button class="login-button" id="loginButton" type="submit">MASUK</button>
                <div class="login-error" id="loginError" role="alert"></div>
            </form>
        </section>

        <div class="login-footer">
            <a href="/">← Kembali ke dashboard</a>
        </div>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const input = document.getElementById("adminPassword");
        const button = document.getElementById("loginButton");
        const errorBox = document.getElementById("loginError");
        const toggle = document.getElementById("togglePassword");

        function showError(message) {
            errorBox.textContent = message || "Login gagal.";
            errorBox.style.display = "block";
        }

        toggle.addEventListener("click", function () {
            const show = input.type === "password";
            input.type = show ? "text" : "password";
            toggle.textContent = show ? "SEMBUNYIKAN" : "LIHAT";
            toggle.setAttribute("aria-label", show ? "Sembunyikan password" : "Tampilkan password");
            input.focus();
        });

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            errorBox.style.display = "none";

            const password = input.value;
            if (!password) {
                showError("Password wajib diisi.");
                return;
            }

            button.disabled = true;
            button.textContent = "MEMERIKSA...";

            try {
                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password })
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Password administrator salah.");
                }

                input.value = "";
                window.location.replace("/admin.html");
            } catch (error) {
                showError(error.message || "Login gagal. Coba lagi.");
                button.disabled = false;
                button.textContent = "MASUK";
                input.focus();
                input.select();
            }
        });
    </script>
</body>
</html>
